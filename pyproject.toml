[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ire-zero"
version = "1.0.0"
description = "Hybrid iOS IPA security analyzer and local workbench with evidence-backed reports."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "iRE-Zero contributors" }]
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dynamic = [
    "frida>=17.0,<18.0",
    "frida-tools>=13.7",
    "objection>=1.11",
]

[project.scripts]
cipherdock = "ire_zero.cli:main"
cipherdock-workbench = "ire_zero.webapp:main"
cipherdock-workbench-restart = "ire_zero.workbench_restart:main"
ire-zero = "ire_zero.cli:main"
ire-zero-workbench = "ire_zero.webapp:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ire_zero*"]

[tool.setuptools.package-data]
ire_zero = ["data/*.json"]
